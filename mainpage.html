<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="mainpage.css">
        <script src="mainpage.js" defer></script>
        <audio id="bgMusic" loop>
            <source src="./happybirthday/music/Tataya.mp3" type="audio/mpeg">
        </audio>

    </head>
    <body>
        
        <div class="layout">
            <div class="boxverify">
                <h1 id="text"></h1>
                <div class="questionCard">
                    <h2 id="question"></h2>
                    <input id="answer" type="text" placeholder="Your answer..">
                    <button id="submit">Answer</button>
                    <p id="hint"></p>
                </div>
                <div class="nameSection">
                    <h1>本名を教えて下さい！</h1>
                    <input class="inputValue" type=text placeholder="Type your name">
                    <button id="button">Enter</button>
                    <h3 id="response"></h3>
                </div>
            </div>
        </div>
    </body>
</html>
